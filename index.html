<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Express.js Syllabus Notes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Full study notes for Express.js: CRUD, JSON, middleware, routing, error handling, config, auth & password hashing, databases." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #16a34a;
      --theme-color-dark: #15803d;
    }
    .app-name-link img { width: 120px; }
    .markdown-section code { border-radius: 4px; }
    .markdown-section pre > code { border-radius: 6px; }
    .sidebar-nav > ul > li > strong { font-size: 12px; letter-spacing: .5px; text-transform: uppercase; color: #6b7280; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; background:#dcfce7; color:#166534; font-size:12px; font-weight:600; }
    .cover-main .anchor span { color: #16a34a; }
  </style>
</head>
<body>
  <div id="app">Loading Express.js notes…</div>
  <script>
    window.$docsify = {
      name: 'Express.js Syllabus',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 3,
      homepage: 'README.md',
      search: {
        depth: 4,
        noData: 'No results.',
        placeholder: 'Search the notes…'
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      tabs: {
        persist: true,
        sync: true
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
